title: AIbex AIOS
intro: Was möchtest du in diesem Projekt tun?
tiles:
  - title: Projekt initialisieren
    text: Ordner zum Projekt machen oder fehlende Teile ergänzen
    skill: aios-init
    icon: folder
  - title: Kontext und Konfiguration
    text: Was ist geladen, welche Einstellungen gelten?
    prompt: "Führe /aios-context aus und zeige danach die Ausgabe von `aios --config`."
    icon: book
  - title: Assistent zuordnen
    text: Einen Assistenten, none oder inherit für dieses Projekt wählen
    prompt: "Zeige mit /aios-assistant die verfügbaren Assistenten und die Zuordnung, lass mich mit dem Auswahlwerkzeug einen Assistenten, none oder inherit wählen und ordne ihn dann zu."
    icon: person
  - title: Skills ausrollen und registrieren
    text: Blueprints mit dem Manifest abgleichen, Skills registrieren
    prompt: "Gleiche mit /aios-deploy die Blueprints mit dem Manifest ab und registriere danach die Skills mit /aios-register."
    icon: gear
  - title: Integrität prüfen
    text: Struktur und Commit-Stand aller Projekte
    skill: aios-integrity
    icon: check
  - title: Projektstatus
    text: Was ist erledigt, was ist offen?
    skill: aios-status
    icon: list
  - title: Memo schreiben
    text: Einen Gedanken als Memo festhalten
    prompt: "Ich möchte ein Memo schreiben. Frag mich zuerst nach dem Inhalt. Verwende /memo, wenn der Skill verfügbar ist, sonst /aios-memo."
    icon: pencil
